<body class="party-bg">

    <div class="bunting" aria-hidden="true"></div>

    <div id="guestPage" class="card-container card-plain guest-card active">

        <!-- Curved na text -->
        <svg class="curve-title pop d1" viewBox="0 22 360 86" aria-label="Join us as we Celebrate!">
            <path id="curvePath" d="M 5 100 Q 180 -15 355 100" fill="none"/>
            <text>
                <textPath href="#curvePath" xlink:href="#curvePath" startOffset="50%" text-anchor="middle">Join us as we Celebrate!</textPath>
            </text>
        </svg>

        <h2 class="guest-name pop d2"><span>Austin Dagsaan Libunao</span></h2>
        <h1 class="guest-bday pop d3">1st Birthday!</h1>

        <!-- Larawan ni Austin sa sunburst stage -->
        <div class="trio">
            <div class="trio-mid pop d4"><img src="assets/main-image.png" alt="Austin" id="imgAustin"></div>
        </div>

        <p class="guest-q pop d7">Are you in for the party?</p>
        <button id="goBtn" class="btn-yes btn-go pop d8">Yes I am going to the party!</button>
    </div>

    <script src="script.js"></script>
    <script>
        // Itago (pero panatilihin ang puwesto) ng larawang hindi ma-load
        document.getElementById('imgAustin').addEventListener('error', function () {
            this.style.visibility = 'hidden';
        });

        // Awtomatikong ipantay sa gitna ang mismong laman ng larawan (kahit hindi pantay ang transparent na espasyo sa PNG)
        function centerPhoto(img) {
            try {
                var w = img.naturalWidth, h = img.naturalHeight;
                if (!w || !h) return;
                var s = Math.min(1, 200 / w);
                var cw = Math.max(1, Math.round(w * s)), ch = Math.max(1, Math.round(h * s));
                var cv = document.createElement('canvas');
                cv.width = cw; cv.height = ch;
                var cx = cv.getContext('2d');
                cx.drawImage(img, 0, 0, cw, ch);
                var d = cx.getImageData(0, 0, cw, ch).data;
                var min = cw, max = -1;
                for (var y = 0; y < ch; y++) {
                    for (var x = 0; x < cw; x++) {
                        if (d[(y * cw + x) * 4 + 3] > 40) {
                            if (x < min) min = x;
                            if (x > max) max = x;
                        }
                    }
                }
                if (max < 0) return;
                var offset = (cw / 2 - (min + max + 1) / 2) / cw;   // bahagi ng lapad
                offset = Math.max(-0.2, Math.min(0.2, offset));
                img.style.transform = 'translateX(' + (offset * 100).toFixed(2) + '%)';
            } catch (e) { /* kung hindi puwede, iwan sa dati */ }
        }
        var austin = document.getElementById('imgAustin');
        if (austin.complete) { centerPhoto(austin); }
        austin.addEventListener('load', function () { centerPhoto(austin); });

        startBalloons();

        document.getElementById('goBtn').addEventListener('click', function () {
            confettiFromEl(this, 28); // sumasabog mula mismo sa button
            setTimeout(function () { window.location.href = 'details?from=guest'; }, 950);
        });
    </script>

</body>
</html>
