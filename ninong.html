<body class="party-bg">

    <div class="bunting" aria-hidden="true"></div>

    <!-- NINONG INVITATION -->
    <div id="proposalPage" class="card-container active">
        <img src="assets/main-image.png" alt="Austin" class="jollibee-img" id="mainImg">

        <div id="story" class="story">
            <h1>Hello I am Austin!</h1>
            <p class="msg">My life would be enriched by your presence and guidance.</p>
            <p class="msg">Can you join us in celebrating this beautiful moment of faith as my</p>
            <h2 class="ask"><span class="hl">Ninong?</span></h2>
        </div>

        <button id="yesBtn" class="btn-yes btn-pulse">Yes!</button>
        <p class="tap-hint">Tap Austin for a surprise! &#127881;</p>
    </div>

    <script src="script.js"></script>
    <script>
        // Kung hindi ma-load ang image, tanggalin ito at alisin ang malaking puwang sa itaas
        document.getElementById('mainImg').addEventListener('error', function () {
            this.style.display = 'none';
            document.getElementById('proposalPage').classList.add('no-image');
        });

        // Bawat pindot sa larawan ni Austin = confetti
        document.getElementById('mainImg').addEventListener('click', function () {
            confettiBurst(20);
        });

        startBalloons();
        startStory();

        // Yes! -> confetti mula sa button, tapos punta sa details page (tandaan kung saan galing)
        document.getElementById('yesBtn').addEventListener('click', function () {
            confettiFromEl(this, 28);
            setTimeout(function () { window.location.href = 'details?from=ninong'; }, 950);
        });
    </script>
