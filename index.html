<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Austin's 1st Birthday!</title>

    <!-- Link preview (Messenger/Facebook). Palitan ang URL kapag lumipat sa Cloudflare (og:image at og:url) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="A special question from Austin">
    <meta property="og:description" content="Austin has something to ask you. Tap to open!">
    <meta property="og:image" content="https://eronwah.github.io/AustinBirthdayInv/assets/preview.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Envelope invitation for Austin's 1st Birthday">
    <meta property="og:url" content="https://eronwah.github.io/AustinBirthdayInv/">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- PAGE 1: NINONG/NINANG PROPOSAL -->
    <div id="proposalPage" class="card-container active">
        <!-- Placeholder image na naka-link sa assets folder sa github mo -->
        <img src="assets/main-image.png" alt="Austin" class="jollibee-img" id="mainImg">
        
        <h1>Hello I am Austin!</h1>
        <p>As I am turning one I wanted to ask you...</p>
        <h2>Will you be my<br>Ninong/Ninang?</h2>
        
        <button id="yesBtn" class="btn-yes">Yes!</button>
    </div>

    <script src="script.js"></script>
    <script>
        // Kung hindi ma-load ang image, tanggalin ito at alisin ang malaking puwang sa itaas
        document.getElementById('mainImg').addEventListener('error', function () {
            this.style.display = 'none';
            document.getElementById('proposalPage').classList.add('no-image');
        });

        // Yes! -> confetti, tapos punta sa details page
        document.getElementById('yesBtn').addEventListener('click', function () {
            confettiBurst(30);
            setTimeout(function () { window.location.href = 'details.html'; }, 700);
        });
    </script>

</body>
</html>
